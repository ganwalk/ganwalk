<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GANWALK — Exp I</title>

<!-- Tudo local: o wallpaper funciona sem internet -->
<script src="lib/three.min.js"></script>
<script src="lib/CopyShader.js"></script>
<script src="lib/LuminosityHighPassShader.js"></script>
<script src="lib/EffectComposer.js"></script>
<script src="lib/ShaderPass.js"></script>
<script src="lib/RenderPass.js"></script>
<script src="lib/UnrealBloomPass.js"></script>

<style>
    @font-face {
        font-family: 'Astloch';
        font-weight: 700;
        font-display: block;
        src: url('fonts/Astloch-Bold.woff2') format('woff2');
    }

    :root {
        --bg-color: #120c07;
        --highlight-color: #ece0c6;
        --highlight-rgb: 236, 224, 198;
        --text-opacity: 1;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background-color: var(--bg-color);
        user-select: none;
    }

    #container {
        position: relative; width: 100%; height: 100%;
        display: flex; justify-content: center; align-items: center;
    }

    canvas#canvas {
        display: block; position: absolute; top: 0; left: 0;
        width: 100%; height: 100%; z-index: 0;
    }

    #main-text {
        font-family: 'Astloch', serif; font-weight: 700; font-size: 10vw;
        color: var(--highlight-color); position: relative; z-index: 1;
        pointer-events: none; text-align: center; line-height: 1;
        white-space: pre;
        opacity: var(--text-opacity);
        text-shadow: 0 0 10px rgba(var(--highlight-rgb), 0.8), 0 0 20px rgba(var(--highlight-rgb), 0.6);
        transition: opacity 0.5s ease, color 0.5s ease;
        will-change: transform;
    }
    #main-text.no-glow { text-shadow: none; }

    /* O "GANWALK" e a caixinha de música dividem o mesmo lugar no centro. */
    #slot { position: relative; z-index: 1; will-change: transform; }
    /* Começam escondidos: a primeira aparição também é em dither. */
    #main-text, #clock, #clock-date { visibility: hidden; }

    /* --- TOCANDO AGORA ---
       Mesma linguagem do painel de controles da Exp I no site: fundo
       --control-bg, borda fina, brilho difuso, rótulos em Silkscreen,
       trilho de 4px e um espectro em barras com dither. Desenhado a 1920px
       de largura e escalado pela tela (--np-scale). */
    @font-face {
        font-family: 'Silkscreen';
        font-weight: 400;
        font-display: block;
        src: url('fonts/Silkscreen-Regular.woff2') format('woff2');
    }
    :root { --control-bg: rgba(18, 12, 7, 0.9); --border-color: rgba(236, 224, 198, 0.3); --np-scale: 1; --np-pulse: 1; }
    #now-playing {
        position: absolute; left: 50%; top: 50%; width: 1040px;
        transform: translate(-50%, -50%) scale(calc(var(--np-scale) * var(--np-pulse)));
        /* Horizontal: capa | informações | barras do espectro no canto superior direito. */
        display: grid; grid-template-columns: 96px 1fr 300px; column-gap: 22px; align-items: center;
        padding: 16px 20px; border-radius: 8px;
        background: var(--control-bg); border: 1px solid var(--border-color);
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        box-shadow: 0 0 30px rgba(var(--highlight-rgb), 0.15);
        color: var(--highlight-color); font-family: 'Inter', sans-serif;
        pointer-events: none; visibility: hidden;
    }
    #np-art {
        width: 96px; height: 96px; display: block; border-radius: 4px;
        border: 1px solid var(--border-color);
        image-rendering: pixelated; image-rendering: crisp-edges;
    }
    #np-info { display: flex; flex-direction: column; min-width: 0; justify-content: center; }
    .np-label {
        font-family: 'Silkscreen', monospace; font-size: 11px; letter-spacing: 0.5px;
        text-transform: uppercase; display: flex; align-items: center; gap: 8px; opacity: 0.9;
    }
    #np-dot { width: 7px; height: 7px; background: var(--highlight-color); box-shadow: 0 0 6px var(--highlight-color); }
    #np-title {
        font-size: 24px; font-weight: 600; line-height: 1.15; margin-top: 6px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        text-shadow: 0 0 10px rgba(var(--highlight-rgb), 0.45);
    }
    #np-artist {
        font-size: 15px; font-weight: 400; margin-top: 4px; opacity: 0.75;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #np-progress { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    #np-progress.hidden { display: none; }
    #np-track { flex: 1; height: 4px; border-radius: 2px; background: var(--border-color); position: relative; overflow: hidden; }
    #np-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--highlight-color); box-shadow: 0 0 6px var(--highlight-color); }
    #np-time { font-family: 'Silkscreen', monospace; font-size: 11px; white-space: nowrap; }
    /* Barras do espectro: soltas no canto superior direito do próprio
       reprodutor (sem caixa), crescendo da direita para a esquerda. Canvas
       em meia resolução ampliado sem suavização, para o dither ficar nítido. */
    #np-bars {
        width: 300px; height: 64px; align-self: start; justify-self: end; display: block;
        image-rendering: pixelated; image-rendering: crisp-edges;
    }

    /* --- RELÓGIO E DATA --- */
    @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        font-display: block;
        src: url('fonts/Inter-Variable.woff2') format('woff2');
    }
    :root { --clock-size: 5; --clock-top: 7; --clock-opacity: 1; --pulse: 0; }
    #clock {
        position: absolute; left: 0; right: 0; top: calc(var(--clock-top) * 1vh);
        z-index: 1; pointer-events: none; text-align: center;
        font-family: 'Inter', 'Segoe UI', sans-serif; color: var(--highlight-color);
        opacity: var(--clock-opacity);
        /* O brilho respira com o grave */
        text-shadow:
            0 0 calc(4px + var(--pulse) * 8px) rgba(var(--highlight-rgb), 0.6),
            0 0 calc(12px + var(--pulse) * 16px) rgba(var(--highlight-rgb), 0.3);
        transition: color 0.5s ease;
    }
    #clock.no-glow { text-shadow: none; }
    #clock.hidden { display: none; }
    #clock-time {
        font-size: calc(var(--clock-size) * 1.15vw); line-height: 1;
        font-weight: 200; letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #clock-ampm { font-size: 0.25em; font-weight: 400; letter-spacing: 0.05em; vertical-align: top; margin-left: 0.3em; }
    #clock-seconds { font-size: 0.45em; opacity: 0.75; margin-left: 0.1em; }
    #clock-date {
        font-size: calc(var(--clock-size) * 0.22vw); margin-top: 0.9em;
        font-weight: 400; letter-spacing: 0.06em; white-space: nowrap; opacity: 0.85;
    }
    #clock-date.hidden { display: none; }

    /* --- ONDA DE DITHER --- */
    /* Canvas em baixa resolução esticado sem suavização: cada célula do
       retículo vira um bloco nítido de N×N pixels na tela. */
    #dither {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 3; pointer-events: none;
        image-rendering: pixelated; image-rendering: crisp-edges;
    }
</style>
</head>
<body>
<div id="container">
    <div id="clock">
        <div id="clock-time"><span id="clock-hm">00:00</span><span id="clock-seconds"></span><span id="clock-ampm"></span></div>
        <div id="clock-date"></div>
    </div>
    <div id="slot">
        <div id="main-text">GANWALK</div>
        <div id="now-playing">
            <canvas id="np-art" width="44" height="44"></canvas>
            <div id="np-info">
                <div class="np-label"><span id="np-dot"></span><span id="np-status">Tocando agora</span></div>
                <div id="np-title"></div>
                <div id="np-artist"></div>
                <div id="np-progress"><div id="np-track"><div id="np-fill"></div></div><span id="np-time"></span></div>
            </div>
            <canvas id="np-bars" width="150" height="32"></canvas>
        </div>
    </div>
    <canvas id="canvas"></canvas>
    <canvas id="dither"></canvas>
</div>

<script>
/*
 * GANWALK — Exp I como wallpaper do Wallpaper Engine.
 *
 * A cena é a mesma do App1 do site (icosaedro em wireframe, grade e três
 * linhas de onda + bloom). A diferença é a fonte do som: em vez de tocar
 * calma.mp3 por um AnalyserNode, o wallpaper ouve o que o computador está
 * reproduzindo através de window.wallpaperRegisterAudioListener, que o
 * Wallpaper Engine chama ~30x por segundo com 128 valores
 * (64 bandas do canal esquerdo + 64 do direito, do grave ao agudo).
 *
 * Os "efeitos" do painel do site (Eco Profundo, Câmara Etérea, etc.) não
 * mexem mais no áudio — o som é do sistema —, mas continuam dirigindo a
 * parte visual exatamente como antes, e viraram propriedades do wallpaper.
 */
const Wallpaper = {
    scene: null, camera: null, renderer: null, composer: null, bloomPass: null,
    fadeScene: null, fadeCamera: null, fadeMesh: null,
    visualGroup: null, centralShape: null, gridLines: [], waveLines: [], waveLinesGroup: null,
    raycaster: new THREE.Raycaster(), mouse: new THREE.Vector2(),
    prevMouse: { x: 0, y: 0 }, dragBurst: 0,

    bgThree: new THREE.Color(0x120c07), fgThree: new THREE.Color(0xece0c6),

    // Equivalentes visuais dos controles da Exp I (0..1, o "véu" é 0..100)
    fx: { delay: 0, reverb: 0, chorus: 0, overdrive: 0, filter: 0 },
    settings: {
        sensitivity: 1, autoGain: true, reverse: false,
        showGrid: true, showWaves: true, showShape: true,
        showText: true, textGlow: true, idleMotion: true,
        quality: 1, fps: 0,
        showClock: true, showDate: true, showSeconds: false, hour24: true, clockGlow: true,
        sceneOffset: 8, // quanto a cena desce para abrir espaço ao relógio (unidades da cena)
    },

    // Estado de áudio
    rawBands: { b: 0, m: 0, h: 0 },
    bands: { b: 0, m: 0, h: 0 },
    peaks: { b: 0.15, m: 0.08, h: 0.04 },
    lastAudioAt: 0,
    hasWallpaperAudio: false,

    paused: false, animationId: null, lastFrame: 0, startedAt: performance.now(),

    init() {
        this.initThree();
        this.setupInteraction();
        this.setupAudio();
        this.onResize();
        this.animate();
        this.updateClock();
        setInterval(() => this.updateClock(), 1000);
    },

    // ---------- ÁUDIO DO SISTEMA ----------
    setupAudio() {
        if (typeof window.wallpaperRegisterAudioListener === 'function') {
            this.hasWallpaperAudio = true;
            window.wallpaperRegisterAudioListener(arr => this.onAudio(arr));
        }
        // Fora do Wallpaper Engine (ex.: abrir no navegador para testar)
        // não há áudio do sistema: um sinal sintético mantém a cena viva.
        this.demoMode = !this.hasWallpaperAudio || /[?&]demo\b/.test(location.search);
    },

    onAudio(arr) {
        if (!arr || arr.length < 128) return;
        // Mistura L+R em 64 bandas e divide como no site:
        // ~10% grave, ~30% médio, ~60% agudo.
        let b = 0, m = 0, h = 0;
        for (let i = 0; i < 64; i++) {
            const v = Math.min(1.5, (arr[i] + arr[i + 64]) * 0.5);
            if (i < 7) b += v; else if (i < 26) m += v; else h += v;
        }
        if (!this.spectrum) this.spectrum = new Float32Array(64);
        for (let i = 0; i < 64; i++) this.spectrum[i] = Math.min(1.5, (arr[i] + arr[i + 64]) * 0.5);
        this.rawBands.b = b / 7;
        this.rawBands.m = m / 19;
        this.rawBands.h = h / 38;
        this.lastAudioAt = performance.now();
    },

    demoBands(t) {
        const beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 * 1.0)), 8);
        this.rawBands.b = 0.12 + beat * 0.5;
        this.rawBands.m = 0.08 + 0.05 * Math.sin(t * 1.3) + beat * 0.08;
        this.rawBands.h = 0.03 + 0.02 * Math.sin(t * 3.1) + Math.random() * 0.02;
    },

    // O AnalyserNode do site devolvia valores em dB (já comprimidos).
    // O Wallpaper Engine entrega amplitude linear, então normalizamos pelo pico
    // recente e aplicamos uma raiz para chegar a uma resposta parecida.
    processBands() {
        const s = this.settings;
        const scale = { b: 0.85, m: 0.6, h: 0.45 };   // faixa típica do site
        const floor = { b: 0.06, m: 0.03, h: 0.015 }; // abaixo disso é silêncio
        const silent = this.hasWallpaperAudio && !this.demoMode && performance.now() - this.lastAudioAt > 1000;

        for (const k of ['b', 'm', 'h']) {
            let v = silent ? 0 : this.rawBands[k];
            let n;
            if (s.autoGain) {
                this.peaks[k] = Math.max(v, this.peaks[k] * 0.997, floor[k]);
                n = Math.sqrt(Math.min(1.2, v / this.peaks[k]));
                // Some com o volume: abaixo do piso a cena descansa.
                n *= Math.min(1, v / floor[k]);
            } else {
                n = Math.sqrt(Math.min(1.2, v * 3));
            }
            const target = Math.min(1.5, n * scale[k] * s.sensitivity);
            // Ataque rápido, soltura suave (o WE atualiza a ~30 Hz, a tela a 60+).
            const a = target > this.bands[k] ? 0.5 : 0.12;
            this.bands[k] += (target - this.bands[k]) * a;
        }
    },

    // ---------- CENA (igual ao App1.initThree) ----------
    initThree() {
        const cvs = document.getElementById('canvas');
        this.scene = new THREE.Scene();
        // Tudo que é 3D fica num grupo raiz, para poder descer a cena inteira.
        this.root = new THREE.Group(); this.scene.add(this.root);
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.z = 50;

        this.renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true, alpha: true, preserveDrawingBuffer: true });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio * this.settings.quality);
        this.renderer.autoClear = false;

        const rp = new THREE.RenderPass(this.scene, this.camera);
        this.bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0, 0.4, 0);
        this.composer = new THREE.EffectComposer(this.renderer);
        this.composer.addPass(rp);
        this.composer.addPass(this.bloomPass);

        this.fadeScene = new THREE.Scene();
        this.fadeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.fadeMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ color: this.bgThree, transparent: true, opacity: 1.0 }));
        this.fadeScene.add(this.fadeMesh);

        this.visualGroup = new THREE.Group(); this.visualGroup.position.y = 12; this.root.add(this.visualGroup);
        this.centralShape = new THREE.Mesh(new THREE.IcosahedronGeometry(8, 0), new THREE.MeshBasicMaterial({ color: this.fgThree, wireframe: true, transparent: true, opacity: 1 }));
        this.visualGroup.add(this.centralShape);

        const gridGroup = new THREE.Group(); gridGroup.position.y = 12; this.root.add(gridGroup);
        const lm = new THREE.LineBasicMaterial({ color: this.fgThree, transparent: true, opacity: 0.6 });
        for (let i = 0; i <= 30; i++) {
            let pts = []; for (let j = 0; j <= 30; j++) pts.push(new THREE.Vector3(j - 15, i - 15, 0));
            let g = new THREE.BufferGeometry().setFromPoints(pts); g.setAttribute('initialPosition', g.attributes.position.clone());
            let l = new THREE.Line(g, lm.clone()); gridGroup.add(l); this.gridLines.push(l);
            pts = []; for (let j = 0; j <= 30; j++) pts.push(new THREE.Vector3(i - 15, j - 15, 0));
            g = new THREE.BufferGeometry().setFromPoints(pts); g.setAttribute('initialPosition', g.attributes.position.clone());
            l = new THREE.Line(g, lm.clone()); gridGroup.add(l); this.gridLines.push(l);
        }

        // No site, com o menu recolhido, as ondas sobem para y=-12 e esticam 4x.
        this.waveLinesGroup = new THREE.Group(); this.waveLinesGroup.position.y = -20; this.root.add(this.waveLinesGroup);
        for (let k = -1; k <= 1; k++) {
            const pts = []; for (let j = 0; j <= 400; j++) pts.push(new THREE.Vector3((j / 400 - 0.5) * 70, k, 0));
            const g = new THREE.BufferGeometry().setFromPoints(pts); g.setAttribute('initialPosition', g.attributes.position.clone());
            const l = new THREE.Line(g, lm.clone()); this.waveLinesGroup.add(l); this.waveLines.push(l);
        }

        window.addEventListener('resize', () => this.onResize());
    },

    // ---------- INTERAÇÃO ----------
    // Arrastar o icosaedro gira a forma (o Wallpaper Engine repassa o mouse
    // quando "Permitir interação com o mouse" está ligado).
    // O icosaedro segue o mouse, sem precisar clicar: a velocidade do
    // movimento vira giro (com inércia, que vai se dissipando) e a posição
    // do cursor inclina a forma levemente na direção dele. Um movimento
    // rápido na horizontal ainda infla a forma, como o "arranhar" do site.
    mouseSpin: { x: 0, y: 0 },
    mouseTilt: { x: 0, y: 0 },
    mouseFollow: 1,
    hasMouse: false,
    setupInteraction() {
        window.addEventListener('mousemove', e => this.onMove(e));
        document.addEventListener('mouseleave', () => { this.mouse.set(0, 0); });
    },
    onMove(e) {
        if (!this.hasMouse) { this.hasMouse = true; this.prevMouse = { x: e.clientX, y: e.clientY }; }
        const dx = e.clientX - this.prevMouse.x;
        const dy = e.clientY - this.prevMouse.y;
        this.prevMouse = { x: e.clientX, y: e.clientY };
        this.mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        this.mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        const k = this.mouseFollow;
        this.mouseSpin.y += dx * 0.0004 * k;
        this.mouseSpin.x += dy * 0.0004 * k;
        this.dragBurst = Math.max(this.dragBurst, Math.min(1, Math.abs(dx) * 0.02 * k));
    },

    // ---------- LOOP (igual ao App1.animate, com t do relógio) ----------
    animate(now) {
        this.animationId = requestAnimationFrame(n => this.animate(n));
        if (this.paused) return;
        if (this.settings.fps > 0 && now) {
            const minDelta = 1000 / this.settings.fps;
            if (now - this.lastFrame < minDelta - 1) return;
            this.lastFrame = now;
        }

        const t = (performance.now() - this.startedAt) / 1000;
        const dir = this.settings.reverse ? -1 : 1;

        if (this.demoMode) this.demoBands(t);
        this.processBands();
        const { b, m, h } = this.bands;
        const avg = (b + m + h) / 3;
        const idle = this.settings.idleMotion ? 1 : 0;

        const dVal = this.fx.delay, rVal = this.fx.reverb, odVal = this.fx.overdrive, cVal = this.fx.chorus;

        document.getElementById('slot').style.transform = `translateY(${this.textShiftPx + this.textDropPx()}px)`;
        document.getElementById('main-text').style.transform = `scale(${1 + avg * 0.05 * dir})`;
        NowPlaying.frame(b, m, h, t, dir);
        document.documentElement.style.setProperty('--pulse', Math.min(1, b).toFixed(3));
        this.fadeMesh.material.opacity = 0.02 + 0.98 * Math.pow(1.0 - rVal, 3);
        this.renderer.setClearColor(this.bgThree, 1 - (dVal * 0.9));
        this.visualGroup.rotation.y += (0.005 * idle + avg * 0.01) * dir;

        this.dragBurst *= 0.9;
        this.visualGroup.scale.setScalar(1 + dVal * 0.1 + Math.sin(t * 2) * dVal * 0.1 + this.dragBurst * 0.5);

        this.centralShape.rotation.x += (0.005 * idle + h * 0.02) * dir + this.mouseSpin.x;
        this.centralShape.rotation.y += (0.005 * idle + m * 0.02) * dir + this.mouseSpin.y;
        // Inércia do giro e inclinação suave em direção ao cursor.
        this.mouseSpin.x *= 0.92; this.mouseSpin.y *= 0.92;
        const tk = 0.35 * this.mouseFollow;
        this.mouseTilt.x += (-this.mouse.y * tk - this.mouseTilt.x) * 0.06;
        this.mouseTilt.y += (this.mouse.x * tk - this.mouseTilt.y) * 0.06;
        this.visualGroup.rotation.x = this.mouseTilt.x;
        this.visualGroup.rotation.z = -this.mouseTilt.y * 0.3;
        this.centralShape.rotation.z += cVal * 0.05 * dir;
        this.centralShape.scale.set(1 + b * 0.5 + odVal * 0.5, 1 + b * 0.5 - odVal * 0.5, 1 + b * 0.5 + odVal * 0.5);

        if (this.settings.showGrid) {
            this.gridLines.forEach(l => {
                const pos = l.geometry.attributes.position.array;
                const init = l.geometry.attributes.initialPosition.array;
                for (let i = 0; i < pos.length; i += 3) {
                    const x = init[i], y = init[i + 1];
                    const w = Math.sin(x * 0.5 + t * 2 * dir) * b * 5 + Math.cos(y * 0.5 + t * 3 * dir) * m * 3 + Math.sin(Math.sqrt(x * x + y * y) * 0.5 - t * 5) * dVal * 5;
                    const jit = (Math.random() - 0.5) * h * 0.8 * (rVal * 8) * dir;
                    pos[i] = x + jit; pos[i + 1] = y + jit; pos[i + 2] = w;
                }
                l.geometry.attributes.position.needsUpdate = true;
            });
        }

        if (this.settings.showWaves) {
            const gap = this.layoutWaves();
            // Mesma fórmula do site (frequência, velocidade e proporção 45/20/15
            // entre grave, médio e agudo), mas a onda agora sobe e desce no
            // plano da tela em vez de vir em direção à câmera: assim a largura
            // na tela é exatamente a do reprodutor, sem a perspectiva esticar.
            const amp = gap * 0.32;
            // O grupo é esticado na horizontal; o x em unidades do mundo mantém
            // o comprimento de onda do site, então cabem mais ondas na tela.
            const sx = this.waveLinesGroup.scale.x;
            this.waveLines.forEach((l, idx) => {
                const pos = l.geometry.attributes.position.array;
                const band = idx === 0 ? b : (idx === 1 ? m : h);
                const baseY = (idx - 1) * gap * 0.08;
                const k = idx === 0 ? 1 : (idx === 1 ? 20 / 45 : 15 / 45);
                for (let i = 0; i < pos.length; i += 3) {
                    pos[i + 1] = baseY + Math.sin(pos[i] * sx * (0.3 + idx * 0.1) + t * (5 + idx) * dir) * band * amp * k;
                    pos[i + 2] = 0;
                }
                l.geometry.attributes.position.needsUpdate = true;
                l.material.opacity = Math.min(1, 0.5 + band * 0.5);
            });
        }

        this.renderer.render(this.fadeScene, this.fadeCamera);
        this.renderer.clearDepth();
        this.composer.render();

        DitherWave.frame(now || performance.now());
    },

    onResize() {
        if (!this.camera) return;
        this.camera.aspect = window.innerWidth / window.innerHeight; this.camera.updateProjectionMatrix();
        this.renderer.setPixelRatio(window.devicePixelRatio * this.settings.quality);
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.composer.setPixelRatio && this.composer.setPixelRatio(window.devicePixelRatio * this.settings.quality);
        this.composer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('main-text').style.fontSize = (this.textSize * (window.innerWidth / 100)) + 'px';
        this.applyOffset();
    },
    textSize: 10,
    textShiftPx: 0,
    taskbarPx: 48,
    textDrop: 4, // % da altura da tela que o "GANWALK" (e o reprodutor) desce, sem mexer nas linhas
    textDropPx() { return this.textDrop / 100 * window.innerHeight; },

    // As três linhas ficam no meio do vão entre o "GANWALK" (ou o reprodutor,
    // o que for mais baixo) e a barra de tarefas, de fora a fora na tela.
    // Devolve a altura do vão em unidades da cena.
    layoutWaves() {
        const H = window.innerHeight;
        const unitsPerPx = 100 * Math.tan(THREE.MathUtils.degToRad(37.5)) / H; // altura visível em z=0 / altura da tela
        // As linhas são calculadas a partir da posição do texto ANTES do
        // "Descer o GANWALK", para ficarem no mesmo lugar quando ele desce.
        const r = document.getElementById('slot').getBoundingClientRect(), drop = this.textDropPx();
        const slot = { top: r.top - drop, bottom: r.bottom - drop, height: r.height };
        const box = document.getElementById('now-playing');
        const npScale = window.innerWidth / 1920 * NowPlaying.boxSize;
        const slotMid = slot.top + slot.height / 2;
        const textBottom = slot.bottom;
        const boxBottom = slotMid + box.offsetHeight * npScale / 2;
        const top = Math.max(textBottom, boxBottom);
        const bottom = H - this.taskbarPx;
        const midPx = (top + bottom) / 2;
        const gapPx = Math.max(20, bottom - top);
        // Tela → mundo (câmera em y=0), depois → local do grupo raiz (que desce sceneOffset).
        const worldY = (H / 2 - midPx) * unitsPerPx;
        this.waveLinesGroup.position.y = worldY - this.root.position.y;
        // As linhas vão de -35 a 35 (70 unidades): escala para a largura do reprodutor.
        // De fora a fora na tela.
        const widthUnits = window.innerWidth * unitsPerPx;
        this.waveLinesGroup.scale.set(widthUnits / 70, 1, 1);
        return gapPx * unitsPerPx;
    },

    // Desce a cena 3D e o texto juntos. Com a câmera em z=50 e FOV 75, a altura
    // visível no plano z=0 é 2·50·tan(37,5°) ≈ 76,7 unidades.
    applyOffset() {
        const off = this.settings.showClock ? this.settings.sceneOffset : 0;
        this.root.position.y = -off;
        this.textShiftPx = off * window.innerHeight / (100 * Math.tan(THREE.MathUtils.degToRad(37.5)));
    },

    // ---------- RELÓGIO ----------
    updateClock() {
        const s = this.settings, now = new Date();
        const pad = n => String(n).padStart(2, '0');
        let hh = now.getHours(), ampm = '';
        if (!s.hour24) { ampm = hh < 12 ? 'AM' : 'PM'; hh = hh % 12 || 12; }
        document.getElementById('clock-hm').textContent = `${pad(hh)}:${pad(now.getMinutes())}`;
        document.getElementById('clock-seconds').textContent = s.showSeconds ? `:${pad(now.getSeconds())}` : '';
        document.getElementById('clock-ampm').textContent = ampm;
        // "Segunda-feira, 28 de outubro"
        let d = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
        d = d.charAt(0).toUpperCase() + d.slice(1);
        document.getElementById('clock-date').textContent = d;
    },

    // ---------- CORES / VISIBILIDADE ----------
    setBgColor(c) {
        this.bgThree.copy(c);
        const hex = '#' + c.getHexString();
        document.documentElement.style.setProperty('--bg-color', hex);
        document.documentElement.style.setProperty('--control-bg', `rgba(${Math.round(c.r * 255)}, ${Math.round(c.g * 255)}, ${Math.round(c.b * 255)}, 0.9)`);
        this.fadeMesh.material.color.copy(c);
    },
    setFgColor(c) {
        this.fgThree.copy(c);
        const hex = '#' + c.getHexString();
        document.documentElement.style.setProperty('--highlight-color', hex);
        document.documentElement.style.setProperty('--highlight-rgb', `${Math.round(c.r * 255)}, ${Math.round(c.g * 255)}, ${Math.round(c.b * 255)}`);
        document.documentElement.style.setProperty('--border-color', `rgba(${Math.round(c.r * 255)}, ${Math.round(c.g * 255)}, ${Math.round(c.b * 255)}, 0.3)`);
        this.centralShape.material.color.copy(c);
        this.gridLines.forEach(l => l.material.color.copy(c));
        this.waveLines.forEach(l => l.material.color.copy(c));
    },
    applyVisibility() {
        const s = this.settings;
        this.centralShape.visible = s.showShape;
        // "Véu Sonoro" no site apagava a grade junto com o filtro passa-baixa.
        const gridOpacity = ((100 - this.fx.filter) / 100) * 0.6;
        this.gridLines.forEach(l => { l.visible = s.showGrid; l.material.opacity = gridOpacity; });
        this.waveLines.forEach(l => { l.visible = s.showWaves; });
        document.getElementById('main-text').classList.toggle('no-glow', !s.textGlow);
        const clock = document.getElementById('clock');
        clock.classList.toggle('no-glow', !s.clockGlow);
        // Toda entrada e saída passa pelo dither (ver DitherFade).
        DitherFade.set(clock, s.showClock);
        DitherFade.set(document.getElementById('clock-date'), s.showClock && s.showDate);
        NowPlaying.update();
        this.applyOffset();
        this.updateClock();
    },
};

// ---------- PROPRIEDADES DO WALLPAPER ENGINE ----------
function weColor(value) {
    const [r, g, b] = value.split(' ').map(Number);
    return new THREE.Color(r, g, b); // o WE manda floats 0..1 no espaço sRGB, como THREE r128 espera
}

window.wallpaperPropertyListener = {
    applyUserProperties(p) {
        const W = Wallpaper, s = W.settings;
        if (p.bgcolor) W.setBgColor(weColor(p.bgcolor.value));
        if (p.fgcolor) W.setFgColor(weColor(p.fgcolor.value));

        if (p.sensitivity) s.sensitivity = p.sensitivity.value;
        if (p.autogain) s.autoGain = p.autogain.value;
        if (p.reverse) s.reverse = p.reverse.value;
        if (p.idlemotion) s.idleMotion = p.idlemotion.value;

        if (p.delay) W.fx.delay = p.delay.value;
        if (p.reverb) { W.fx.reverb = p.reverb.value; W.bloomPass.strength = W.fx.reverb * 2.0 + W.bloomBase; }
        if (p.bloom) { W.bloomBase = p.bloom.value; W.bloomPass.strength = W.fx.reverb * 2.0 + W.bloomBase; }
        if (p.chorus) W.fx.chorus = p.chorus.value;
        if (p.overdrive) W.fx.overdrive = p.overdrive.value;
        if (p.filter) W.fx.filter = p.filter.value;

        if (p.showshape) s.showShape = p.showshape.value;
        if (p.showgrid) s.showGrid = p.showgrid.value;
        if (p.showwaves) s.showWaves = p.showwaves.value;
        if (p.showtext) s.showText = p.showtext.value;
        if (p.textglow) s.textGlow = p.textglow.value;
        if (p.customtext) document.getElementById('main-text').textContent = p.customtext.value || 'GANWALK';
        if (p.textsize) { W.textSize = p.textsize.value; W.onResize(); }
        if (p.textopacity) document.documentElement.style.setProperty('--text-opacity', p.textopacity.value);

        if (p.quality) { s.quality = parseFloat(p.quality.value); W.onResize(); }

        if (p.showclock) s.showClock = p.showclock.value;
        if (p.showdate) s.showDate = p.showdate.value;
        if (p.showseconds) s.showSeconds = p.showseconds.value;
        if (p.hour24) s.hour24 = p.hour24.value;
        if (p.clockglow) s.clockGlow = p.clockglow.value;
        if (p.clocksize) document.documentElement.style.setProperty('--clock-size', p.clocksize.value);
        if (p.clocktop) document.documentElement.style.setProperty('--clock-top', p.clocktop.value);
        if (p.clockopacity) document.documentElement.style.setProperty('--clock-opacity', p.clockopacity.value);
        if (p.sceneoffset) s.sceneOffset = p.sceneoffset.value;

        const D = DitherWave;
        if (p.ditherenabled) { D.enabled = p.ditherenabled.value; if (!D.enabled) { D.startedAt = -1; D.ctx.clearRect(0, 0, D.w, D.h); } }
        if (p.ditherinterval) { D.intervalMs = p.ditherinterval.value * 1000; D.nextAt = Math.min(D.nextAt, performance.now() + D.intervalMs); }
        if (p.ditherduration) D.durationMs = p.ditherduration.value * 1000;
        if (p.ditherwidth) D.widthFrac = p.ditherwidth.value / 100;
        if (p.ditherpixel) { D.pixelSize = p.ditherpixel.value; D.resize(); }
        if (p.ditherlift) D.lift = p.ditherlift.value;
        if (p.dithermode) D.mode = p.dithermode.value;
        if (p.ditherdirection) D.direction = p.ditherdirection.value;
        if (p.ditherbass) D.bassTrigger = p.ditherbass.value;
        if (p.dithermediainterval) D.mediaIntervalMs = p.dithermediainterval.value * 1000;
        if (p.ditherpixel) DitherFade.buildTiles();

        const N = NowPlaying;
        if (p.npenabled) N.enabled = p.npenabled.value;
        if (p.npholdafter) N.holdAfter = p.npholdafter.value;
        if (p.npsize) N.boxSize = p.npsize.value;
        if (p.npprogress) N.showProgress = p.npprogress.value;
        if (p.taskbar) W.taskbarPx = p.taskbar.value;
        if (p.mousefollow) W.mouseFollow = p.mousefollow.value;
        if (p.textdrop) W.textDrop = p.textdrop.value;
        if (p.ditherbasssens) D.bassSensitivity = p.ditherbasssens.value;
        if (p.ditherbasscooldown) D.bassCooldownMs = p.ditherbasscooldown.value * 1000;

        W.applyVisibility();
    },
    applyGeneralProperties(p) {
        if (p.fps !== undefined) Wallpaper.settings.fps = p.fps;
    },
    setPaused(isPaused) {
        Wallpaper.paused = isPaused;
    },
};

/*
 * ONDA DE DITHER
 *
 * A cada N segundos (10 por padrão) uma faixa atravessa a tela e, por onde
 * passa, o wallpaper inteiro (cena 3D, "GANWALK", relógio) vira um retículo
 * de dither ordenado. O motor é o mesmo do Playground do portfólio
 * (ganwalk/portifolio, src/lib/dither.ts e src/lib/use-bayer-dither.ts):
 *
 *   · matriz de Bayer construída recursivamente (buildBayer, idêntica);
 *   · luminância Rec. 601 (0.299R + 0.587G + 0.114B), não só o canal vermelho;
 *   · `bias` somado ao limiar da matriz;
 *   · fase da matriz deslocada a cada STEP_MS (175 ms), que lê como cintilação;
 *   · canvas em baixa resolução, ampliado sem suavização.
 *
 * Duas adaptações para o wallpaper:
 *
 * 1. A borda da onda também é dither: a força da onda num ponto (0 a 1) é
 *    comparada com o mesmo limiar da matriz, então a faixa não tem borda lisa,
 *    ela "dissolve" em retículo nas pontas.
 * 2. A cena é quase toda fundo escuro, e com o limiar puro quase nada
 *    passaria. A luminância ganha um empurrão (`lift`) proporcional à força
 *    da onda: o fundo vira pontilhado e as linhas viram blocos cheios.
 *    No modo "Duotone" o resultado usa as cores do tema (foco/fundo); no modo
 *    "Máscara de cor" é exatamente o comportamento do portfólio: cor
 *    original onde passa do limiar, preto onde não passa.
 */
const DitherWave = {
    // Mesmos valores do use-bayer-dither.ts do portfólio
    MATRIX_SIZE: 4,
    STEP_MS: 175,
    BIAS: 42,
    PHASES: [ { x: 0, y: 0 }, { x: 2, y: 0 }, { x: 2, y: 2 }, { x: 0, y: 2 } ],

    enabled: true,
    intervalMs: 10000,
    durationMs: 2400,
    pixelSize: 3,
    widthFrac: 0.35,     // largura da faixa em relação à tela
    lift: 55,            // empurrão de luminância no centro da onda
    mode: 'duotone',     // 'duotone' | 'mask'
    direction: 'radial', // 'radial' (sai do icosaedro) | 'right' | 'left' | 'down' | 'diagonal'

    canvas: null, ctx: null, w: 0, h: 0,
    nextAt: 0, startedAt: -1, phaseIndex: 0, lastStep: 0,
    bayerCache: new Map(),

    // Portado de buildBayer (ganwalk/portifolio, src/lib/dither.ts)
    buildBayer(size) {
        const cached = this.bayerCache.get(size);
        if (cached) return cached;
        let m = [0], s = 1;
        while (s < size) {
            const next = s * 2, grown = new Array(next * next);
            for (let y = 0; y < s; y++) {
                for (let x = 0; x < s; x++) {
                    const v = m[y * s + x];
                    grown[y * next + x] = 4 * v;
                    grown[y * next + (x + s)] = 4 * v + 2;
                    grown[(y + s) * next + x] = 4 * v + 3;
                    grown[(y + s) * next + (x + s)] = 4 * v + 1;
                }
            }
            m = grown; s = next;
        }
        const matrix = new Uint16Array(m);
        this.bayerCache.set(size, matrix);
        return matrix;
    },

    init() {
        this.canvas = document.getElementById('dither');
        this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.nextAt = performance.now() + 3000; // primeira onda logo no começo
    },

    resize() {
        this.w = Math.max(1, Math.round(window.innerWidth / this.pixelSize));
        this.h = Math.max(1, Math.round(window.innerHeight / this.pixelSize));
        this.canvas.width = this.w;
        this.canvas.height = this.h;
    },

    trigger() { this.startedAt = performance.now(); },

    // Chamado no fim de cada quadro do Wallpaper.animate, depois do render.
    // Disparo pelo grave: compara o grave do quadro com a média recente dele.
    // Um salto bem acima da média (a batida de um bumbo, um drop) dispara a
    // onda na hora, sem esperar o intervalo. O tempo mínimo entre disparos
    // evita que uma sequência de bumbos vire uma onda atrás da outra.
    bassTrigger: true,
    bassSensitivity: 0.5,  // 0 a 1
    bassCooldownMs: 2500,
    bassAvg: 0, lastKickAt: -Infinity,

    detectKick(now) {
        const bass = Wallpaper.bands.b;
        const isKick = bass > 0.45 && bass - this.bassAvg > 0.35 - 0.25 * this.bassSensitivity;
        // Média lenta (≈1 s), atualizada depois da comparação.
        this.bassAvg += (bass - this.bassAvg) * 0.03;
        if (!isKick || now - this.lastKickAt < this.bassCooldownMs) return false;
        this.lastKickAt = now;
        return true;
    },

    lastEndAt: 0,     // fim do último pulso (base do intervalo com música)
    pending: false,   // a troca para o reprodutor está acontecendo e o pulso vem logo em seguida
    requested: false, // alguém pediu um pulso fora de hora (música começou, faixa nova)

    request() { this.requested = true; },

    // Dispara o pulso. Se há música tocando, o "GANWALK" vira o reprodutor
    // logo antes (NowPlaying.beforePulse) e só então a onda sai do icosaedro.
    start() {
        if (!this.enabled) {
            // Onda desligada: o pedido (música nova) só troca o centro, sem onda.
            if (NowPlaying.wantsSwap()) NowPlaying.beforePulse().then(() => setTimeout(() => NowPlaying.afterPulse(), this.durationMs));
            return;
        }
        if (NowPlaying.wantsSwap()) {
            this.pending = true;
            NowPlaying.beforePulse().then(() => { this.pending = false; this.startedAt = performance.now(); });
        } else {
            this.startedAt = performance.now();
        }
    },

    // Com música tocando (integração de mídia), o pulso fica mais espaçado:
    // a cada `mediaIntervalMs` (25 s). O grave continua valendo, mas aí ele
    // não adianta o pulso: passados os 25 s, o pulso espera a próxima batida
    // forte para cair no tempo da música (no máximo `beatWaitMs`).
    mediaIntervalMs: 25000,
    beatWaitMs: 3000,

    frame(now) {
        const kick = this.enabled && this.bassTrigger && this.detectKick(now);
        if (this.startedAt < 0) {
            if (this.pending) return;
            let due;
            if (NowPlaying.playing) {
                const nextAt = this.lastEndAt + this.mediaIntervalMs;
                const onBeat = kick || !this.bassTrigger || now >= nextAt + this.beatWaitMs;
                due = this.requested || (this.enabled && now >= nextAt && onBeat);
            } else {
                due = this.requested || (this.enabled && (kick || now >= this.nextAt));
            }
            if (!due) return;
            this.requested = false;
            this.start();
            if (this.startedAt < 0) return;
            now = this.startedAt;
        }
        const k = (now - this.startedAt) / this.durationMs;
        if (k >= 1) {
            this.ctx.clearRect(0, 0, this.w, this.h);
            this.startedAt = -1;
            this.nextAt = now + this.intervalMs;
            this.lastEndAt = now;
            NowPlaying.afterPulse(); // ...e volta para o "GANWALK" logo depois
            return;
        }
        if (now - this.lastStep >= this.STEP_MS) {
            this.lastStep = now;
            this.phaseIndex = (this.phaseIndex + 1) % this.PHASES.length;
        }
        this.render(k);
    },

    // Desenha o quadro atual inteiro (WebGL + textos do DOM) no canvas pequeno.
    capture() {
        const ctx = this.ctx, w = this.w, h = this.h, sx = w / window.innerWidth;
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#' + Wallpaper.bgThree.getHexString();
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(Wallpaper.renderer.domElement, 0, 0, w, h);

        // Os textos são DOM, fora do WebGL: redesenha cada um na mesma posição.
        const fg = '#' + Wallpaper.fgThree.getHexString();
        const drawText = (el, text, alpha, align = 'center') => {
            if (!el || !text || el.offsetParent === null || DitherFade.isHidden(el)) return;
            const r = el.getBoundingClientRect();
            if (r.width === 0) return;
            const cs = getComputedStyle(el);
            const scale = r.height / el.offsetHeight || 1; // pega o scale() do pulso
            const size = parseFloat(cs.fontSize) * scale * sx;
            ctx.font = `${cs.fontWeight} ${size}px ${cs.fontFamily}`;
            ctx.textAlign = align;
            if ('letterSpacing' in ctx) ctx.letterSpacing = (parseFloat(cs.letterSpacing) || 0) * scale * sx + 'px';
            ctx.textBaseline = 'middle';
            ctx.globalAlpha = alpha;
            ctx.fillStyle = fg;
            ctx.fillText(text, (align === 'left' ? r.left : r.left + r.width / 2) * sx, (r.top + r.height / 2) * sx);
        };
        const rootStyle = getComputedStyle(document.documentElement);
        const textOp = parseFloat(rootStyle.getPropertyValue('--text-opacity')) || 1;
        const clockOp = parseFloat(rootStyle.getPropertyValue('--clock-opacity')) || 1;
        const main = document.getElementById('main-text');
        drawText(main, main.textContent, textOp);
        const hm = document.getElementById('clock-hm');
        drawText(document.getElementById('clock-time'), hm.textContent + document.getElementById('clock-seconds').textContent, clockOp);
        const date = document.getElementById('clock-date');
        drawText(date, date.textContent, clockOp * 0.85);

        // A caixinha de música: fundo, borda, capa e textos principais.
        const box = document.getElementById('now-playing');
        if (!DitherFade.isHidden(box)) {
            const r = box.getBoundingClientRect();
            ctx.globalAlpha = 0.9;
            ctx.fillStyle = '#' + Wallpaper.bgThree.getHexString();
            ctx.fillRect(r.left * sx, r.top * sx, r.width * sx, r.height * sx);
            ctx.globalAlpha = 0.35;
            ctx.strokeStyle = fg; ctx.lineWidth = 1;
            ctx.strokeRect(r.left * sx + 0.5, r.top * sx + 0.5, r.width * sx - 1, r.height * sx - 1);
            ctx.globalAlpha = 1;
            const art = document.getElementById('np-art'), ar = art.getBoundingClientRect();
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(art, ar.left * sx, ar.top * sx, ar.width * sx, ar.height * sx);
            ctx.imageSmoothingEnabled = true;
            const bars = document.getElementById('np-bars'), br = bars.getBoundingClientRect();
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(bars, br.left * sx, br.top * sx, br.width * sx, br.height * sx);
            ctx.imageSmoothingEnabled = true;
            const label = document.getElementById('np-status');
            drawText(label, label.textContent.toUpperCase(), 0.9, 'left');
            for (const id of ['np-title', 'np-artist', 'np-time']) {
                const el = document.getElementById(id);
                drawText(el, el.textContent, id === 'np-artist' ? 0.75 : 1, 'left');
            }
        }
        ctx.globalAlpha = 1;
    },

    render(k) {
        const w = this.w, h = this.h;
        this.capture();
        const image = this.ctx.getImageData(0, 0, w, h);
        const data = image.data;

        const size = this.MATRIX_SIZE, mask = size - 1;
        const matrix = this.buildBayer(size);
        const scale255 = 255 / (size * size);
        const phase = this.PHASES[this.phaseIndex];

        // Geometria da onda. No modo radial (padrão) ela nasce no icosaedro:
        // u é a distância até o centro dele na tela, e a onda é um anel que
        // se expande. Nos outros modos, u é a projeção num eixo (faixa reta).
        const radial = this.direction === 'radial';
        let ax = 1, ay = 0, ox = 0, oy = 0, cx = 0, cy = 0, span, center, half;
        if (radial) {
            const v = new THREE.Vector3();
            Wallpaper.centralShape.getWorldPosition(v).project(Wallpaper.camera);
            cx = (v.x + 1) / 2 * w;
            cy = (1 - v.y) / 2 * h;
            // Até o canto mais distante, para o anel sair da tela inteira.
            span = Math.hypot(Math.max(cx, w - cx), Math.max(cy, h - cy));
            half = this.widthFrac * span / 2;
            // Sai rápido do icosaedro e desacelera ao se espalhar (ease-out).
            const e = 1 - Math.pow(1 - k, 3);
            center = e * (span + half);
        } else {
            if (this.direction === 'left') { ax = -1; ay = 0; }
            else if (this.direction === 'down') { ax = 0; ay = 1; }
            else if (this.direction === 'diagonal') { ax = 0.7071; ay = 0.7071; }
            span = Math.abs(ax) * w + Math.abs(ay) * h;
            ox = ax < 0 ? w : 0; oy = ay < 0 ? h : 0;
            // Posição do centro da faixa, com aceleração suave na entrada e saída.
            const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
            half = this.widthFrac * span / 2;
            center = -half + e * (span + 2 * half);
        }

        const fg = Wallpaper.fgThree, bg = Wallpaper.bgThree;
        const fr = fg.r * 255, fgG = fg.g * 255, fb = fg.b * 255;
        const br = bg.r * 255, bgG = bg.g * 255, bb = bg.b * 255;
        const duo = this.mode === 'duotone';
        const lift = this.lift;

        for (let y = 0; y < h; y++) {
            const row = ((y + phase.y) & mask) * size;
            for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                const u = radial ? Math.hypot(x - cx, y - cy) : (x - ox) * ax + (y - oy) * ay;
                const d = Math.abs(u - center) / half;
                const threshold = matrix[row + ((x + phase.x) & mask)] * scale255;
                // Força da onda (0 a 1), cosseno: cheia no meio, zero nas bordas.
                const p = d < 1 ? 0.5 + 0.5 * Math.cos(Math.PI * d) : 0;
                // Borda em dither: fora da onda (ou abaixo do limiar) fica transparente.
                if (p * 255 <= threshold) { data[i + 3] = 0; continue; }

                const r = data[i], g = data[i + 1], b = data[i + 2];
                const luminance = 0.299 * r + 0.587 * g + 0.114 * b + lift * p;
                const pass = luminance >= threshold + this.BIAS;
                if (duo) {
                    if (pass) { data[i] = fr; data[i + 1] = fgG; data[i + 2] = fb; }
                    else { data[i] = br; data[i + 1] = bgG; data[i + 2] = bb; }
                } else if (!pass) {
                    data[i] = 0; data[i + 1] = 0; data[i + 2] = 0;
                }
                data[i + 3] = 255;
            }
        }
        this.ctx.putImageData(image, 0, 0);
    },
};

/*
 * DITHERFADE: entrada e saída de elementos do DOM por dither ordenado.
 *
 * Usa a mesma matriz de Bayer 4×4 da onda (e do Playground do portfólio)
 * como máscara CSS: para cada nível de 0 a 16 existe um ladrilho onde só as
 * células com valor da matriz abaixo do nível ficam opacas. Subir o nível
 * de 0 a 16 faz o elemento aparecer ponto a ponto, na ordem da matriz;
 * descer faz ele se desfazer do mesmo jeito. Durante a transição, a fase do
 * ladrilho muda a cada 175 ms, como a cintilação do portfólio.
 */
const DitherFade = {
    DURATION: 560,
    tiles: [],
    cell: 0,
    running: new Map(),

    buildTiles() {
        const cell = DitherWave.pixelSize;
        if (cell === this.cell && this.tiles.length) return;
        this.cell = cell;
        const size = DitherWave.MATRIX_SIZE, matrix = DitherWave.buildBayer(size);
        const c = document.createElement('canvas');
        c.width = c.height = size * cell;
        const ctx = c.getContext('2d');
        this.tiles = [];
        for (let level = 0; level <= size * size; level++) {
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.fillStyle = '#fff';
            for (let y = 0; y < size; y++)
                for (let x = 0; x < size; x++)
                    if (matrix[y * size + x] < level) ctx.fillRect(x * cell, y * cell, cell, cell);
            this.tiles.push(`url(${c.toDataURL()})`);
        }
    },

    isHidden(el) { return el.style.visibility === 'hidden' || getComputedStyle(el).visibility === 'hidden'; },

    applyLevel(el, level, phase) {
        const max = this.tiles.length - 1;
        if (level >= max) {
            el.style.webkitMaskImage = el.style.maskImage = '';
            el.style.visibility = 'visible';
            return;
        }
        if (level <= 0) { el.style.visibility = 'hidden'; return; }
        const tile = this.tiles[level], sizePx = DitherWave.MATRIX_SIZE * this.cell + 'px';
        const pos = `${phase.x * this.cell}px ${phase.y * this.cell}px`;
        el.style.visibility = 'visible';
        el.style.webkitMaskImage = el.style.maskImage = tile;
        el.style.webkitMaskSize = el.style.maskSize = `${sizePx} ${sizePx}`;
        el.style.webkitMaskRepeat = el.style.maskRepeat = 'repeat';
        el.style.webkitMaskPosition = el.style.maskPosition = pos;
    },

    // Leva o elemento até visível (true) ou escondido (false). Resolve quando termina.
    set(el, visible, duration = this.DURATION) {
        this.buildTiles();
        const target = visible ? 1 : 0;
        if (el.dataset.ditherTarget === String(target)) return this.running.get(el) || Promise.resolve();
        el.dataset.ditherTarget = String(target);
        const from = parseFloat(el.dataset.ditherLevel ?? (this.isHidden(el) ? 0 : 1));
        const max = this.tiles.length - 1;
        const promise = new Promise(resolve => {
            const start = performance.now();
            const total = Math.abs(target - from) * duration;
            const step = now => {
                if (el.dataset.ditherTarget !== String(target)) return resolve(); // outra transição assumiu
                const k = total > 0 ? Math.min(1, (now - start) / total) : 1;
                const lv = from + (target - from) * k;
                el.dataset.ditherLevel = lv;
                const phase = DitherWave.PHASES[Math.floor(now / DitherWave.STEP_MS) % DitherWave.PHASES.length];
                this.applyLevel(el, Math.round(lv * max), phase);
                if (k < 1) requestAnimationFrame(step); else resolve();
            };
            requestAnimationFrame(step);
        });
        this.running.set(el, promise);
        return promise;
    },
};

/*
 * TOCANDO AGORA
 *
 * Lê a música que o computador está tocando pela integração de mídia do
 * Wallpaper Engine (Spotify, Tidal, navegador... qualquer app que apareça
 * no controle de mídia do Windows). Enquanto ela toca, a cada pulso de
 * dither o "GANWALK" vira o reprodutor logo antes da onda sair do
 * icosaedro, e volta logo depois que ela passa. O reprodutor tem capa,
 * título, artista, progresso e um espectro em barras com dither.
 * Música nova (ou o começo de uma) também dispara um pulso.
 *
 * Toda troca (texto ↔ reprodutor, música nova, pausa) passa pelo DitherFade.
 * A capa também passa pelo dither do portfólio (ditherFrame), cintilando.
 */
const NowPlaying = {
    enabled: true,
    boxSize: 1,
    showProgress: true,

    media: { title: '', artist: '', album: '', state: 0, position: 0, duration: 0, posAt: 0, hasTimeline: false },
    thumb: null,       // Image da capa
    playing: false,
    showing: 'text',   // o que ocupa o centro agora: 'text' | 'box'
    stopTimer: null,
    busy: Promise.resolve(),
    artPhase: 0, artLastStep: 0,

    PLAYING() { const w = window.wallpaperMediaIntegration; return w ? w.PLAYBACK_PLAYING : 1; },

    register() {
        if (typeof window.wallpaperRegisterMediaPropertiesListener !== 'function') return false;
        window.wallpaperRegisterMediaPropertiesListener(e => this.onProperties(e));
        window.wallpaperRegisterMediaThumbnailListener(e => this.onThumbnail(e));
        window.wallpaperRegisterMediaPlaybackListener(e => this.onPlayback(e));
        if (typeof window.wallpaperRegisterMediaTimelineListener === 'function')
            window.wallpaperRegisterMediaTimelineListener(e => this.onTimeline(e));
        if (typeof window.wallpaperRegisterMediaStatusListener === 'function')
            window.wallpaperRegisterMediaStatusListener(e => { if (!e.enabled) this.onPlayback({ state: 0 }); });
        return true;
    },

    onProperties(e) {
        const changed = e.title !== this.media.title || e.artist !== this.media.artist;
        this.media.title = e.title || '';
        this.media.artist = e.artist || '';
        this.media.album = e.albumTitle || '';
        if (changed) { this.media.hasTimeline = false; this.trackChanged(); }
    },
    onThumbnail(e) {
        if (!e.thumbnail) { this.thumb = null; return; }
        const img = new Image();
        img.onload = () => { this.thumb = img; };
        img.src = e.thumbnail;
    },
    onPlayback(e) {
        this.media.state = e.state;
        this.media.posAt = performance.now();
        this.update();
    },
    onTimeline(e) {
        this.media.position = e.position;
        this.media.duration = e.duration;
        this.media.posAt = performance.now();
        this.media.hasTimeline = e.duration > 0;
    },

    isPlaying() { return this.enabled && this.media.state === this.PLAYING() && !!this.media.title; },

    // Reavalia o estado (música tocando ou não, configurações mudaram).
    update() {
        const text = document.getElementById('main-text');
        const box = document.getElementById('now-playing');
        const showText = Wallpaper.settings.showText;
        const playing = this.isPlaying();

        if (playing) {
            clearTimeout(this.stopTimer); this.stopTimer = null;
            if (!this.playing) {
                this.playing = true;
                this.fillBox();
                // A música começou: um pulso apresenta o reprodutor.
                if (showText) DitherWave.request(); else this.swapTo('box');
            } else if (!showText && this.showing !== 'box') this.swapTo('box');
            else if (showText && this.showing === 'box' && !this.inPulse) this.swapTo('text');
            return;
        }
        // Pausou ou parou: espera um pouco (troca de faixa às vezes passa por
        // "parado" por um instante) e então devolve o centro ao texto.
        if (this.playing && !this.stopTimer) {
            this.stopTimer = setTimeout(() => {
                this.stopTimer = null;
                if (this.isPlaying()) return;
                this.playing = false;
                clearTimeout(this.holdTimer);
                this.swapTo('text');
            }, 1500);
        }
        if (!this.playing && !this.stopTimer) {
            DitherFade.set(box, false);
            DitherFade.set(text, showText);
            this.showing = 'text';
        }
    },

    trackChanged() {
        if (!this.isPlaying()) return;
        if (!this.playing) { this.update(); return; }
        if (this.showing === 'box' && !Wallpaper.settings.showText) {
            this.swapTo('box', true); // reprodutor fixo: troca a faixa em dither
        } else {
            this.fillBox();
            DitherWave.request(); // música nova: um pulso apresenta a faixa
        }
    },

    // O pulso só troca o centro quando há música e o "GANWALK" está à mostra.
    wantsSwap() {
        return this.playing && this.isPlaying() && Wallpaper.settings.showText && this.showing === 'text';
    },

    inPulse: false,
    holdTimer: null,
    holdAfter: 0.6, // segundos que o reprodutor fica depois que a onda passa

    beforePulse() {
        this.inPulse = true;
        clearTimeout(this.holdTimer);
        return this.swapTo('box', false, 260);
    },

    afterPulse() {
        if (!this.inPulse) return;
        clearTimeout(this.holdTimer);
        this.holdTimer = setTimeout(() => {
            this.inPulse = false;
            if (Wallpaper.settings.showText || !this.playing) this.swapTo('text');
        }, this.holdAfter * 1000);
    },

    swapTo(target, refresh = false, dur = DitherFade.DURATION) {
        this.busy = this.busy.then(async () => {
            const text = document.getElementById('main-text');
            const box = document.getElementById('now-playing');
            const showText = Wallpaper.settings.showText;
            if (target === 'box' && !this.playing) return; // música já parou
            const out = this.showing === 'box' ? box : text;
            if (this.showing !== target || refresh) await DitherFade.set(out, false, dur);
            if (target === 'box') this.fillBox();
            this.showing = target;
            if (target === 'box') await DitherFade.set(box, true, dur);
            else await DitherFade.set(text, showText, dur);
        });
        return this.busy;
    },

    fillBox() {
        document.getElementById('np-title').textContent = this.media.title;
        const sub = [this.media.artist, this.media.album].filter(Boolean).join(' · ');
        document.getElementById('np-artist').textContent = sub;
    },

    fmt(s) { s = Math.max(0, s); return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`; },

    // Chamado a cada quadro pelo Wallpaper.animate.
    frame(b, m, h, t, dir) {
        const box = document.getElementById('now-playing');
        const root = document.documentElement.style;
        root.setProperty('--np-scale', (window.innerWidth / 1920 * this.boxSize).toFixed(4));
        if (DitherFade.isHidden(box)) return;
        // A caixinha respira com o grave, como o "GANWALK".
        root.setProperty('--np-pulse', (1 + b * 0.04).toFixed(4));

        // Progresso: interpola entre os avisos do Wallpaper Engine.
        const md = this.media, prog = document.getElementById('np-progress');
        const hasTl = this.showProgress && md.hasTimeline;
        prog.classList.toggle('hidden', !hasTl);
        if (hasTl) {
            const pos = Math.min(md.duration, md.position + (md.state === this.PLAYING() ? (performance.now() - md.posAt) / 1000 : 0));
            document.getElementById('np-fill').style.width = (pos / md.duration * 100) + '%';
            document.getElementById('np-time').textContent = `${this.fmt(pos)} / ${this.fmt(md.duration)}`;
        }

        this.drawArt();
        this.drawBars(t);
    },

    // Capa com o mesmo motor do portfólio (ditherFrame): recorte object-cover,
    // luminância Rec. 601, viés de 42 e fase trocando a cada 175 ms.
    drawArt() {
        const now = performance.now();
        if (now - this.artLastStep < DitherWave.STEP_MS) return;
        this.artLastStep = now;
        this.artPhase = (this.artPhase + 1) % DitherWave.PHASES.length;
        const cvs = document.getElementById('np-art'), ctx = cvs.getContext('2d', { willReadFrequently: true });
        const W = cvs.width, H = cvs.height;
        const fg = Wallpaper.fgThree, bg = Wallpaper.bgThree;
        if (this.thumb) {
            const img = this.thumb, sr = img.naturalWidth / img.naturalHeight;
            let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
            if (sr > 1) { sw = sh; sx = (img.naturalWidth - sw) / 2; } else if (sr < 1) { sh = sw; sy = (img.naturalHeight - sh) / 2; }
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
        } else {
            // Sem capa: um degradê na cor de foco, que o dither transforma em retícula.
            const g = ctx.createLinearGradient(0, 0, W, H);
            g.addColorStop(0, '#' + fg.getHexString()); g.addColorStop(1, '#' + bg.getHexString());
            ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
        const image = ctx.getImageData(0, 0, W, H), data = image.data;
        const size = DitherWave.MATRIX_SIZE, mask = size - 1, matrix = DitherWave.buildBayer(size);
        const scale255 = 255 / (size * size), phase = DitherWave.PHASES[this.artPhase];
        const duo = DitherWave.mode === 'duotone';
        for (let y = 0; y < H; y++) {
            const row = ((y + phase.y) & mask) * size;
            for (let x = 0; x < W; x++) {
                const i = (y * W + x) * 4;
                const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                const pass = lum >= matrix[row + ((x + phase.x) & mask)] * scale255 + DitherWave.BIAS;
                if (duo) {
                    const c = pass ? fg : bg;
                    data[i] = c.r * 255; data[i + 1] = c.g * 255; data[i + 2] = c.b * 255;
                } else if (!pass) { data[i] = 0; data[i + 1] = 0; data[i + 2] = 0; }
                data[i + 3] = 255;
            }
        }
        ctx.putImageData(image, 0, 0);
    },

    // ESPECTRO EM BARRAS
    // 8 barras (do grave, em cima, ao agudo, embaixo) que crescem da direita
    // para a esquerda. O preenchimento é dither ordenado com a matriz de Bayer
    // do portfólio: cheio junto à borda direita e cada vez mais ralo até a
    // ponta, com a fase da matriz trocando a cada 175 ms (a cintilação) e uma
    // leve ondulação na densidade, que faz o retículo "respirar".
    BAR_EDGES: [0, 2, 4, 7, 11, 17, 26, 38, 64], // faixas das 64 bandas do Wallpaper Engine
    barLevels: new Float32Array(8),
    barPeaks: new Float32Array(8).fill(0.05),
    barHold: new Float32Array(8),

    drawBars(t) {
        const cvs = document.getElementById('np-bars'), ctx = cvs.getContext('2d');
        const W = cvs.width, H = cvs.height, N = 8;
        const rows = H / N, thick = Math.max(1, Math.round(rows * 0.75)); // barra + respiro
        const spec = Wallpaper.spectrum, sens = Wallpaper.settings.sensitivity;
        const bands = Wallpaper.bands;

        for (let i = 0; i < N; i++) {
            let v;
            if (spec && !Wallpaper.demoMode) {
                let sum = 0;
                for (let j = this.BAR_EDGES[i]; j < this.BAR_EDGES[i + 1]; j++) sum += spec[j];
                v = sum / (this.BAR_EDGES[i + 1] - this.BAR_EDGES[i]);
                this.barPeaks[i] = Math.max(v, this.barPeaks[i] * 0.996, 0.02);
                v = Math.sqrt(Math.min(1, v / this.barPeaks[i])) * Math.min(1, v / 0.02);
            } else {
                // Sem espectro (navegador): deriva das três bandas.
                const k = i / (N - 1);
                v = (k < 0.5 ? bands.b * (1 - 2 * k) + bands.m * 2 * k : bands.m * (2 - 2 * k) + bands.h * (2 * k - 1)) * 1.2;
                v *= 0.75 + 0.25 * Math.sin(t * 7 + i * 1.7);
            }
            const target = Math.min(1, v * sens);
            this.barLevels[i] += (target - this.barLevels[i]) * (target > this.barLevels[i] ? 0.5 : 0.15);
            // Marcador de pico, que cai devagar.
            this.barHold[i] = Math.max(this.barLevels[i], this.barHold[i] - 0.006);
        }

        const img = ctx.createImageData(W, H), d = img.data;
        const fg = Wallpaper.fgThree, r = fg.r * 255, g = fg.g * 255, b = fg.b * 255;
        const size = DitherWave.MATRIX_SIZE, mask = size - 1, matrix = DitherWave.buildBayer(size);
        const levels = size * size;
        const phase = DitherWave.PHASES[Math.floor(performance.now() / DitherWave.STEP_MS) % DitherWave.PHASES.length];
        const plot = (x, y) => { const o = (y * W + x) * 4; d[o] = r; d[o + 1] = g; d[o + 2] = b; d[o + 3] = 255; };

        for (let i = 0; i < N; i++) {
            const len = Math.round(this.barLevels[i] * W);
            const y0 = Math.round(i * rows);
            const breathe = 0.85 + 0.15 * Math.sin(t * 6 + i * 0.9);
            for (let y = y0; y < y0 + thick && y < H; y++) {
                const row = ((y + phase.y) & mask) * size;
                for (let dx = 0; dx < len; dx++) {
                    const x = W - 1 - dx;
                    // Densidade: 100% na borda direita, ~20% na ponta.
                    const dens = (1 - 0.8 * (dx / Math.max(1, len))) * breathe;
                    if (dens * levels > matrix[row + ((x + phase.x) & mask)]) plot(x, y);
                }
                // Pico: um traço vertical de 1 célula, meio retícula.
                const hx = W - 1 - Math.round(this.barHold[i] * W);
                if (hx >= 0 && hx < W - len && ((hx + y + phase.x) & 1)) plot(hx, y);
            }
        }
        ctx.putImageData(img, 0, 0);
    },

    // Fora do Wallpaper Engine não há integração de mídia: uma faixa de
    // exemplo deixa a caixinha visível no navegador.
    demo() {
        this.onProperties({ title: 'calma', artist: 'GANWALK', albumTitle: '2026' });
        this.onTimeline({ position: 42, duration: 213 });
        this.onPlayback({ state: 1 });
    },
};

Wallpaper.bloomBase = 0;

// A integração de mídia tem que ser registrada logo, não depois do load.
const hasMedia = NowPlaying.register();
DitherWave.init();
Wallpaper.init();
Wallpaper.applyVisibility();
if (!hasMedia && Wallpaper.demoMode) setTimeout(() => NowPlaying.demo(), 2500);
</script>
</body>
</html>
